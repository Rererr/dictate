<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>dictate 評価シート</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 -apple-system, "Hiragino Sans", sans-serif; max-width: 920px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  ol.how { padding-left: 1.4em; }
  .row { display: grid; grid-template-columns: 3.2em 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  .id { font-weight: 700; }
  .script { font-size: 17px; }
  .note { font-size: 13px; opacity: .75; }
  textarea { grid-column: 2; width: 100%; box-sizing: border-box; font: inherit; padding: 8px; min-height: 3.4em; }
  .row.filled .id::after { content: " ✓"; }
  footer { position: sticky; bottom: 0; padding: 12px 0; background: Canvas; border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); display: flex; gap: 12px; align-items: center; }
  button { font: inherit; padding: 6px 14px; }
  #out { width: 100%; height: 8em; font: 12px ui-monospace, monospace; }
</style>
<h1>dictate 評価シート（肉声 20 文）</h1>
<ol class="how">
  <li>各行の入力欄にカーソルを置き、ホットキーを押している間に台本を読み、離す。</li>
  <li>言い損ねたら欄を空にしてやり直す。手では直さない（挿入された文字列をそのまま採点する）。</li>
  <li>「送信して」で終わる台本は、挿入の後に改行が 1 つ入れば正しい。</li>
  <li>全部の行を終えたら「書き出し」を押す。保存された JSON を採点に使う。</li>
</ol>
<div id="rows"></div>
<footer>
  <button id="export">書き出し</button>
  <span id="progress"></span>
</footer>
<p class="note">保存できないときは、下の欄の内容を <code>dictate-eval.json</code> として保存する。</p>
<textarea id="out" readonly aria-label="書き出した JSON"></textarea>
<script>
// script: 読み上げる文。expected: 挿入されるべき文（末尾コマンドを除く）。
const SEND = "送信して";
// 台本の組。URL の ?set=... で切り替える
const SETS = {
  eval20: { title: "肉声 20 文", file: "dictate-eval.json", sentences: [
  ["S1", "slack", "さっきの件、明日の朝一でレビューお願いできますか。", true, "末尾コマンド"],
  ["S2", "slack", "PR 3113のテストが落ちているので、原因を見てからもう一度プッシュします。", false, "数値、英字"],
  ["S3", "slack", "えっと、本番デプロイは15時からでいいですか。", false, "フィラー、数値"],
  ["S4", "slack", "ステージングで再現できました。マイグレーションの順序が原因です。", false, "カタカナ語"],
  ["S5", "slack", "了解です、午後に対応します。", true, "末尾コマンド"],
  ["S6", "slack", "このファイルを送信してから、もう一度連絡します。", false, "文中の「送信して」（送らない）"],
  ["S7", "slack", "あの、Laravelのキューが詰まっているみたいなので、ワーカーを再起動します。", false, "フィラー、辞書"],
  ["M1", "mail", "お世話になっております。先日ご相談いただいた件について、ご連絡いたします。", false, "敬語"],
  ["M2", "mail", "来週の水曜日、14時から30分ほどお時間をいただけますでしょうか。", false, "数値"],
  ["M3", "mail", "えー、見積書を添付いたしましたので、ご確認をお願いいたします。", false, "フィラー"],
  ["M4", "mail", "ご指摘の不具合は、10月15日のリリースで修正する予定です。", false, "日付"],
  ["M5", "mail", "お手数をおかけしますが、ご検討のほどよろしくお願いいたします。", true, "末尾コマンド"],
  ["M6", "mail", "請求金額は税込みで12万8千円です。", false, "金額"],
  ["C1", "care", "朝食は主食が全量、副食が半分で、水分は150。", false, "単位のない数値"],
  ["C2", "care", "血圧は120の78、脈拍は72、体温は36度5分。", false, "数値の連続"],
  ["C3", "care", "山田さん、排泄介助、排尿あり、褥瘡なし。", false, "辞書"],
  ["C4", "care", "経管栄養は14時に実施、特に変わりなし。", false, "辞書、数値"],
  ["C5", "care", "えっと、入浴後に仙骨部の発赤を確認、看護師に報告。", false, "フィラー、辞書"],
  ["C6", "care", "昼食後に嚥下体操を実施、むせ込みなし。", false, "辞書"],
  ["C7", "care", "夜間は巡視3回、良眠されていた。", false, "辞書、数値"],
] },
  // 同じ語が毎回同じ表記に認識されるかを見る。語ごとに 5 文、語の順は入れ替えてある
  stability: { title: "誤表記の安定性（5 語 × 5 回）", file: "dictate-stability.json", sentences: [
  ["H1", "発赤", "仙骨部に発赤あり、看護師に報告。", false, "発赤"],
  ["R1", "良眠", "夜間は良眠されていた。", false, "良眠"],
  ["D1", "デプロイ", "本番へのデプロイは15時からです。", false, "デプロイ"],
  ["Q1", "キュー", "ジョブのキューが詰まっています。", false, "キュー"],
  ["J1", "褥瘡", "褥瘡なし、皮膚の状態は良好。", false, "褥瘡"],
  ["H2", "発赤", "右のかかとに発赤が見られる。", false, "発赤"],
  ["R2", "良眠", "昨夜は良眠できたとのこと。", false, "良眠"],
  ["D2", "デプロイ", "デプロイが終わったら連絡します。", false, "デプロイ"],
  ["Q2", "キュー", "キューのワーカーを再起動します。", false, "キュー"],
  ["J2", "褥瘡", "仙骨部に褥瘡ができている。", false, "褥瘡"],
  ["H3", "発赤", "入浴後、背中の発赤は消えていた。", false, "発赤"],
  ["R3", "良眠", "巡視のたびに良眠を確認。", false, "良眠"],
  ["D3", "デプロイ", "ステージングにデプロイして確認します。", false, "デプロイ"],
  ["Q3", "キュー", "メールの送信はキューに入れています。", false, "キュー"],
  ["J3", "褥瘡", "褥瘡の処置を行い、ガーゼを交換した。", false, "褥瘡"],
  ["H4", "発赤", "発赤の範囲が昨日より広がっている。", false, "発赤"],
  ["R4", "良眠", "眠剤を使わずに良眠されている。", false, "良眠"],
  ["D4", "デプロイ", "今日のデプロイは延期になりました。", false, "デプロイ"],
  ["Q4", "キュー", "キューに溜まったジョブを確認します。", false, "キュー"],
  ["J4", "褥瘡", "褥瘡予防のため、体位変換を2時間ごとに実施。", false, "褥瘡"],
  ["H5", "発赤", "おむつ交換のときに発赤を確認した。", false, "発赤"],
  ["R5", "良眠", "日中の活動が増えてから良眠が続いている。", false, "良眠"],
  ["D5", "デプロイ", "デプロイの手順書を更新しました。", false, "デプロイ"],
  ["Q5", "キュー", "失敗したジョブをキューに戻します。", false, "キュー"],
  ["J5", "褥瘡", "褥瘡の大きさを計測して記録した。", false, "褥瘡"],
  ] },
  // 同じ読みの語（キューと旧、急、級）を条件つきで直せるかと、言い換え語の安定性を見る
  collision: { title: "同じ読みの衝突と言い換え（40 文）", file: "dictate-collision.json", sentences: [
  ["K1", "キュー", "キューの中身を確認してください。", false, "キュー"],
  ["N1", "旧", "旧バージョンとの互換性を確認します。", false, "旧（キューにしない）"],
  ["J1", "褥瘡", "褥瘡の有無を確認した。", false, "褥瘡"],
  ["P1", "ジョブキュー", "ジョブキューが詰まっています。", false, "言い換え: ジョブキュー"],
  ["K2", "キュー", "通知はキューに積んでから送ります。", false, "キュー"],
  ["N2", "旧", "旧サーバーは来月停止します。", false, "旧（キューにしない）"],
  ["J2", "褥瘡", "かかとに褥瘡の兆候あり。", false, "褥瘡"],
  ["P2", "床ずれ", "床ずれなし、皮膚の状態は良好。", false, "言い換え: 床ずれ"],
  ["K3", "キュー", "キューが空になるまで待ちます。", false, "キュー"],
  ["N3", "急", "急な変更で申し訳ありません。", false, "急（キューにしない）"],
  ["J3", "褥瘡", "褥瘡は改善傾向にある。", false, "褥瘡"],
  ["P3", "ジョブキュー", "ジョブキューのワーカーを再起動します。", false, "言い換え: ジョブキュー"],
  ["K4", "キュー", "優先度の高いキューを先に処理します。", false, "キュー"],
  ["N4", "旧", "データは旧テーブルから移行しました。", false, "旧（キューにしない）"],
  ["J4", "褥瘡", "褥瘡部を洗浄し、軟膏を塗布。", false, "褥瘡"],
  ["P4", "床ずれ", "仙骨部に床ずれができている。", false, "言い換え: 床ずれ"],
  ["K5", "キュー", "このジョブは別のキューに移しました。", false, "キュー"],
  ["N5", "旧", "旧仕様のまま動いている画面があります。", false, "旧（キューにしない）"],
  ["J5", "褥瘡", "褥瘡のリスクが高いため、エアマットを使用。", false, "褥瘡"],
  ["P5", "ジョブキュー", "メールの送信はジョブキューに入れています。", false, "言い換え: ジョブキュー"],
  ["K6", "キュー", "キューの長さを監視しています。", false, "キュー"],
  ["N6", "急", "負荷が急に上がりました。", false, "急（キューにしない）"],
  ["J6", "褥瘡", "背部に褥瘡は見られない。", false, "褥瘡"],
  ["P6", "床ずれ", "床ずれの処置を行い、ガーゼを交換した。", false, "言い換え: 床ずれ"],
  ["K7", "キュー", "リトライはキューに任せています。", false, "キュー"],
  ["N7", "旧", "旧の設定ファイルは削除しました。", false, "旧（キューにしない）"],
  ["J7", "褥瘡", "褥瘡の写真を撮って記録に残した。", false, "褥瘡"],
  ["P7", "ジョブキュー", "ジョブキューに溜まった処理を確認します。", false, "言い換え: ジョブキュー"],
  ["K8", "キュー", "キューの設定を見直しました。", false, "キュー"],
  ["N8", "級", "英検は何級を持っていますか。", false, "級（キューにしない）"],
  ["J8", "褥瘡", "医師に褥瘡の状態を報告した。", false, "褥瘡"],
  ["P8", "床ずれ", "床ずれ予防のため、体位変換を実施。", false, "言い換え: 床ずれ"],
  ["K9", "キュー", "ワーカーがキューを読んでいません。", false, "キュー"],
  ["N9", "旧", "旧画面へのリンクが残っています。", false, "旧（キューにしない）"],
  ["J9", "褥瘡", "新たな褥瘡の発生なし。", false, "褥瘡"],
  ["P9", "ジョブキュー", "失敗した処理をジョブキューに戻します。", false, "言い換え: ジョブキュー"],
  ["K10", "キュー", "夜間にキューが溢れていました。", false, "キュー"],
  ["N10", "急", "急を要する対応ではありません。", false, "急（キューにしない）"],
  ["J10", "褥瘡", "褥瘡が悪化していないか観察する。", false, "褥瘡"],
  ["P10", "床ずれ", "床ずれの大きさを計測して記録した。", false, "言い換え: 床ずれ"],
  ] },
};
const SET = SETS[new URLSearchParams(location.search).get("set")] ?? SETS.eval20;
document.querySelector("h1").textContent = `dictate 評価シート（${SET.title}）`;
const SENTENCES = SET.sentences.map(([id, style, expected, command, focus]) => ({ id, style, expected, command, focus, script: command ? expected + SEND : expected }));

const rows = document.getElementById("rows");
for (const s of SENTENCES) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<div class="id"></div><div><div class="script"></div><div class="note"></div></div><textarea rows="2"></textarea>`;
  row.querySelector(".id").textContent = s.id;
  row.querySelector(".script").textContent = s.script;
  row.querySelector(".note").textContent = "見るもの: " + s.focus;
  const area = row.querySelector("textarea");
  area.id = "t-" + s.id;
  area.setAttribute("aria-label", s.id + " の入力欄");
  area.addEventListener("input", () => { row.classList.toggle("filled", area.value.trim() !== ""); progress(); });
  rows.append(row);
}
function progress() {
  const done = SENTENCES.filter(s => document.getElementById("t-" + s.id).value.trim() !== "").length;
  document.getElementById("progress").textContent = `${done} / ${SENTENCES.length} 行に入力あり`;
}
progress();
document.getElementById("export").addEventListener("click", () => {
  const data = { exportedAt: new Date().toISOString(), rows: SENTENCES.map(s => ({ ...s, text: document.getElementById("t-" + s.id).value })) };
  const json = JSON.stringify(data, null, 2);
  document.getElementById("out").value = json;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  link.download = SET.file;
  link.click();
});
</script>
</html>
